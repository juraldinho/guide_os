name: Integration Contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contracts:
    name: Validate pinned integration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CONTRACT_REPOSITORY: juraldinho/guide-os-integration-contracts
      CONTRACT_TAG: v1.2.0
      CONTRACT_COMMIT: 28eeec371208c4d58dea008e4890f6b69f651c75
      CONTRACT_VERSION: "1.2.0"

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      # CONTRACTS_READ_TOKEN is required because the authoritative contracts repository is private.
      # It must have only read access to juraldinho/guide-os-integration-contracts.
      # Forks or contexts where GitHub withholds secrets will fail closed at private checkout.
      # Never add a fallback to a public branch, unauthenticated mutable download, copied schema, or skipped validation.

      - name: Checkout immutable integration contracts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTRACT_REPOSITORY }}
          ref: ${{ env.CONTRACT_TAG }}
          token: ${{ secrets.CONTRACTS_READ_TOKEN }}
          path: .integration-contracts
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable contract identity
        run: |
          set -euo pipefail
          cd .integration-contracts
          actual_commit="$(git rev-parse HEAD)"
          if [ "$actual_commit" != "${{ env.CONTRACT_COMMIT }}" ]; then
            echo "Contract commit mismatch: expected ${{ env.CONTRACT_COMMIT }}, got ${actual_commit}"
            exit 1
          fi
          actual_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$actual_version" != "${{ env.CONTRACT_VERSION }}" ]; then
            echo "Contract version mismatch: expected ${{ env.CONTRACT_VERSION }}, got ${actual_version}"
            exit 1
          fi
          echo "Verified tag=${{ env.CONTRACT_TAG }} commit=${{ env.CONTRACT_COMMIT }} version=${{ env.CONTRACT_VERSION }}"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install contract validation dependencies
        run: python -m pip install --disable-pip-version-check -r .integration-contracts/requirements-dev.txt

      - name: Run contract validator
        working-directory: .integration-contracts
        run: |
          set -euo pipefail
          output="$(python scripts/validate_contracts.py)"
          echo "$output"
          echo "$output" | grep -q '^PYTHON_VERSION='
          echo "$output" | grep -q 'VALIDATION_OK'

      - name: Run contract tests
        working-directory: .integration-contracts
        run: python -m pytest -q

      - name: Verify contract whitespace
        working-directory: .integration-contracts
        run: git diff --check
