name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: "ci-placeholder"
      APP_ENV: "test"
      GUIDESHOP_READS_ENABLED: "false"
      GUIDESHOP_LINKING_ENABLED: "false"
      GUIDESHOP_EVENTS_ENABLED: "false"
      GUIDESHOP_NOTIFICATIONS_ENABLED: "false"
      GUIDESHOP_USE_FAKE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Verify whitespace
        run: git diff --check

      - name: Run tests
        run: python -m pytest -q
